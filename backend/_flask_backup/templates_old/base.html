<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Takhrij Hadis{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script>
        // Check local storage or system preference as early as possible to prevent flashing
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        /* Smooth Transition for Theme Switcher */
        body,
        .glass-panel,
        input,
        select,
        textarea,
        button,
        a {
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dark Mode Styling Overrides */
        .dark body {
            background-color: #0b0f19;
            color: #cbd5e1;
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
        }

        /* Card background overrides */
        .dark .bg-white {
            background-color: #111827 !important;
            /* bg-slate-900 */
        }

        .dark .bg-slate-50 {
            background-color: #0b0f19 !important;
        }

        .dark .bg-slate-50\/50 {
            background-color: rgba(11, 15, 25, 0.5) !important;
        }

        .dark .bg-slate-100 {
            background-color: #1f2937 !important;
            /* bg-slate-800 */
        }

        .dark .bg-emerald-50 {
            background-color: rgba(16, 185, 129, 0.1) !important;
            border-color: rgba(16, 185, 129, 0.2) !important;
        }

        .dark .bg-emerald-100 {
            background-color: rgba(16, 185, 129, 0.15) !important;
        }

        /* Border overrides */
        .dark .border-slate-100,
        .dark .border-slate-200,
        .dark .border-slate-200\/50 {
            border-color: rgba(255, 255, 255, 0.06) !important;
        }

        .dark .border-emerald-100,
        .dark .border-emerald-200 {
            border-color: rgba(16, 185, 129, 0.2) !important;
        }

        /* Text overrides */
        .dark .text-slate-900 {
            color: #f8fafc !important;
        }

        .dark .text-slate-800 {
            color: #e2e8f0 !important;
        }

        .dark .text-slate-700 {
            color: #cbd5e1 !important;
        }

        .dark .text-slate-600 {
            color: #94a3b8 !important;
        }

        .dark .text-slate-500 {
            color: #64748b !important;
        }

        .dark .text-slate-400 {
            color: #475569 !important;
        }

        .dark .text-emerald-800 {
            color: #34d399 !important;
        }

        .dark .text-emerald-700 {
            color: #6ee7b7 !important;
        }

        .dark .text-emerald-600 {
            color: #34d399 !important;
        }

        /* Navigation & Active states */
        .dark nav {
            background: linear-gradient(to right, #064e3b, #0d9488) !important;
            /* Rich deep emerald-teal */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .dark .hover\:bg-slate-100:hover {
            background-color: #1f2937 !important;
        }

        .dark .bg-white\/20:hover {
            background-color: rgba(255, 255, 255, 0.25) !important;
        }

        /* Input fields and selects */
        .dark input,
        .dark select,
        .dark textarea {
            background-color: #1f2937 !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
        }

        .dark input::placeholder {
            color: #475569 !important;
        }

        /* Chat bubble special styles */
        .dark .bg-slate-800 {
            background-color: #0b0f19 !important;
            /* User bubble background */
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Sanad Graph Inversion for Dark Theme */
        .dark img[alt="Grafik Sanad"],
        .dark img.mix-blend-multiply {
            filter: invert(0.9) hue-rotate(180deg);
            mix-blend-mode: normal !important;
        }

        /* Footer override */
        .dark footer {
            background-color: #020617 !important;
            border-top: 1px solid rgba(255, 255, 255, 0.03) !important;
        }
    </style>
</head>

<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{{ url_for('hadith.index') }}"
                        class="flex items-center gap-2 text-2xl font-bold tracking-tight hover:text-emerald-100 transition-colors">
                        <i class="fa-solid fa-book-open"></i> Smart Takhrij
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('hadith.index') }}"
                        class="font-medium hover:text-emerald-200 transition-colors">Beranda</a>
                    <a href="{{ url_for('ai_chat.chat_interface') }}"
                        class="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-full font-medium transition-all duration-300 flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> Tanya ILHA
                    </a>
                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle"
                        class="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition-all duration-300 focus:outline-none flex items-center justify-center"
                        aria-label="Toggle Theme">
                        <i id="theme-toggle-dark-icon" class="hidden fa-solid fa-moon text-lg"></i>
                        <i id="theme-toggle-light-icon" class="hidden fa-solid fa-sun text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-300 py-8 text-center mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 Smart Takhrij Hadis. Dibangun dengan Flask & AI.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            // Function to update the icons based on dark class state
            function updateIcons() {
                if (document.documentElement.classList.contains('dark')) {
                    themeToggleLightIcon.classList.remove('hidden');
                    themeToggleDarkIcon.classList.add('hidden');
                } else {
                    themeToggleDarkIcon.classList.remove('hidden');
                    themeToggleLightIcon.classList.add('hidden');
                }
            }

            // Initial icon configuration
            updateIcons();

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    // Toggle dark mode class
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    }
                    updateIcons();
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
