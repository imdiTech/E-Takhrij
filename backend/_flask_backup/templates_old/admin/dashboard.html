{% extends "admin/base.html" %}

{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-900">Dashboard</h1>
        <p class="text-slate-500 mt-1">Ikhtisar sistem dan statistik data.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Card 1 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-6">
            <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-slate-500">Total Hadis</p>
                <p class="text-3xl font-bold text-slate-900">{{ hadith_count }}</p>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-6">
            <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl">
                <i class="fa-solid fa-users"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-slate-500">Admin Terdaftar</p>
                <p class="text-3xl font-bold text-slate-900">{{ user_count }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
